services:
  - type: web
    name: maitri-v6-backend
    runtime: docker
    plan: free
    region: oregon
    rootDir: backend
    dockerfilePath: Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: CORS_ORIGINS
        value: https://maitri-prod.vercel.app/
      - key: DATABASE_URL
        sync: false
      - key: SARVAM_API_KEY
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: FIREBASE_API_KEY
        sync: false
      - key: RENDER
        value: "1"
      - key: ENVIRONMENT
        value: production
      - key: EMOTION_MODEL_ENABLED
        value: "false"

  - type: web
    name: maitri-v6-frontend
    runtime: docker
    plan: free
    region: oregon
    rootDir: frontend
    dockerfilePath: Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://maitri-v6-backend.onrender.com
      - key: PORT
        value: 3000
